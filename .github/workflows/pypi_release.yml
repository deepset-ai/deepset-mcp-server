name: Publish deepset-mcp distribution to PyPI and TestPyPI
on:
  push:
    tags:
      - 'v*.*.*'        # matches v1.0.0, v0.10.0, etc.
      - 'v*.*.*-rc*'    # matches v1.0.2-rc1, v0.10.0-rc2, etc.
jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Set up Python
      run: uv python install
    - name: Install the project
      run: uv sync --locked --all-extras --dev
    - name: Build a binary wheel and a source tarball
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
  publish-to-pypi:
    name: >-
      Publish deepset-mcp distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deepset-mcp
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
  bump-hep:
    name: Bump deepset-mcp version in hep
    # Only stable releases are rolled out to hep; release candidates are skipped.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc')
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
    - name: Wait for the release to be available on PyPI
      run: |
        VERSION="${VERSION#v}"
        for _ in {1..10}; do
          curl -sf "https://pypi.org/pypi/deepset-mcp/${VERSION}/json" > /dev/null && echo "✅ deepset-mcp ${VERSION} is on PyPI" && exit 0
          sleep 30
        done
        echo "::error::deepset-mcp ${VERSION} not found on PyPI"
        exit 1
    - name: Trigger the version bump workflow in hep
      env:
        GH_TOKEN: ${{ secrets.HEP_BOT_TOKEN }}
      run: |
        gh workflow run mcp-update-deepset-mcp-version.yml -R deepset-ai/hep -f deepset_mcp_version="${VERSION#v}"
